# Used by Vercel to install the backend and find the app. Local development and the
# Dockerfile use backend/requirements.txt; keep the two lists in step.
[project]
name = "claim-adjudicator"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "google-genai==2.28.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
]

[tool.vercel]
entrypoint = "main:app"
