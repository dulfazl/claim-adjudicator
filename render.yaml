# Render blueprint: one free web service built from the Dockerfile.
# In the Render dashboard choose New > Blueprint and pick this repository.
services:
  - type: web
    name: claim-adjudicator
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Render asks for the value when the service is created; it is never stored in this repository
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
